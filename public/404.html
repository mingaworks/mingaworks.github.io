<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mingaworks — Production Studio</title>
    <script>
      // SPA redirect for GitHub Pages — encodes the path into the query string
      // so the server always serves index.html, then the script below restores it.
      // https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(0)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
